name: Generate Snake Animation

on:
  schedule:
    # Chạy tự động mỗi 12 tiếng một lần
    - cron: "0 */12 * * *"
  
  # Cho phép bấm nút chạy thủ công bất cứ lúc nào
  workflow_dispatch:
  
  # Chạy mỗi khi push lên nhánh main
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Generate Contribution Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: DrGifter
          github_token: ${{ secrets.PAT_SNAKE || github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=#38bdf8&color_dots=#161b22,#0c4a6e,#0284c7,#38bdf8,#bae6fd
          
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🎨 Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_SNAKE }}
